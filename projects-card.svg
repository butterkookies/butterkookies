<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #ffffff; stroke: #eaeaea; stroke-width: 1.5; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #000000; }
    .proj-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #111111; }
    .proj-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #666666; }
    .icon { fill: none; stroke: #888888; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0a0a0a; stroke: #333333; }
      .title { fill: #ffffff; }
      .proj-title { fill: #eeeeee; }
      .proj-desc { fill: #a0a0a0; }
      .icon { stroke: #aaaaaa; }
    }
  </style>
  <rect class="bg" width="398" height="198" x="1" y="1" rx="16" ry="16" />
  
  <text class="title" x="32" y="50">Top Projects</text>
  
  <!-- Project 1 -->
  <!-- Folder icon -->
  <path class="icon" d="M32 95 L32 80 L42 80 L46 84 L56 84 L56 95 Z" />
  <text class="proj-title" x="70" y="87">Project Placeholder 1</text>
  <text class="proj-desc" x="70" y="105">A really cool project I built recently.</text>

  <!-- Project 2 -->
  <!-- Folder icon -->
  <path class="icon" d="M32 155 L32 140 L42 140 L46 144 L56 144 L56 155 Z" />
  <text class="proj-title" x="70" y="147">Project Placeholder 2</text>
  <text class="proj-desc" x="70" y="165">Another amazing application I developed.</text>

</svg>
