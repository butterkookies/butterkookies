<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #ffffff; stroke: #eaeaea; stroke-width: 1.5; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #000000; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 400; fill: #666666; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0a0a0a; stroke: #333333; }
      .title { fill: #ffffff; }
      .subtitle { fill: #a0a0a0; }
    }
  </style>
  <rect class="bg" width="398" height="198" x="1" y="1" rx="16" ry="16" />
  
  <text class="title" x="32" y="55">Hi there! 👋</text>
  <text class="title" x="32" y="85">I'm butterkookies.</text>
  
  <text class="subtitle" x="32" y="125">A minimalist &amp; playful developer exploring</text>
  <text class="subtitle" x="32" y="145">code, learning new technologies, and</text>
  <text class="subtitle" x="32" y="165">building cool things.</text>
</svg>
