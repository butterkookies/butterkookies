<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #ffffff; stroke: #eaeaea; stroke-width: 1.5; }
    .pill { fill: #f5f5f5; stroke: #e0e0e0; stroke-width: 1; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #000000; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #333333; text-anchor: middle; dominant-baseline: middle; }
    
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0a0a0a; stroke: #333333; }
      .pill { fill: #1a1a1a; stroke: #444444; }
      .title { fill: #ffffff; }
      .pill-text { fill: #e0e0e0; }
    }
  </style>
  <rect class="bg" width="398" height="198" x="1" y="1" rx="16" ry="16" />
  
  <text class="title" x="32" y="50">Tech Stack &amp; Tools</text>
  
  <!-- Row 1 -->
  <!-- Python -->
  <rect class="pill" x="32" y="85" width="90" height="32" rx="16" ry="16" />
  <text class="pill-text" x="77" y="101">Python</text>
  
  <!-- C -->
  <rect class="pill" x="138" y="85" width="90" height="32" rx="16" ry="16" />
  <text class="pill-text" x="183" y="101">C</text>

  <!-- C# -->
  <rect class="pill" x="244" y="85" width="90" height="32" rx="16" ry="16" />
  <text class="pill-text" x="289" y="101">C#</text>
  
  <!-- Row 2 -->
  <!-- HTML5 -->
  <rect class="pill" x="32" y="132" width="90" height="32" rx="16" ry="16" />
  <text class="pill-text" x="77" y="148">HTML5</text>
  
  <!-- CSS3 -->
  <rect class="pill" x="138" y="132" width="90" height="32" rx="16" ry="16" />
  <text class="pill-text" x="183" y="148">CSS3</text>

  <!-- SQL -->
  <rect class="pill" x="244" y="132" width="90" height="32" rx="16" ry="16" />
  <text class="pill-text" x="289" y="148">SQL</text>

</svg>
