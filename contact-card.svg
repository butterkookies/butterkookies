<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #ffffff; stroke: #eaeaea; stroke-width: 1.5; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #000000; }
    .link-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #444444; }
    .icon { fill: none; stroke: #666666; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0a0a0a; stroke: #333333; }
      .title { fill: #ffffff; }
      .link-text { fill: #cccccc; }
      .icon { stroke: #aaaaaa; }
    }
  </style>
  <rect class="bg" width="398" height="118" x="1" y="1" rx="16" ry="16" />
  
  <text class="title" x="32" y="45">Let's Connect!</text>
  
  <!-- LinkedIn -->
  <circle class="icon" cx="40" cy="80" r="10" />
  <text class="link-text" x="58" y="85">LinkedIn</text>

  <!-- Twitter / X -->
  <circle class="icon" cx="150" cy="80" r="10" />
  <text class="link-text" x="168" y="85">Twitter / X</text>

  <!-- Website -->
  <circle class="icon" cx="270" cy="80" r="10" />
  <text class="link-text" x="288" y="85">Portfolio</text>
  
</svg>
