<svg width="1200" height="396" viewBox="0 0 1200 396" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hdr-title hdr-desc">
  <title id="hdr-title">Andrei John Geronimo — @butterkookies</title>
  <desc id="hdr-desc">Warm espresso and butter-cookie editorial hero banner for Andrei John Geronimo with custom emblem and tagline I build quiet tools for busy minds.</desc>
  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .live-dot {
      animation: pulseDot 2.8s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .live-dot { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="hdrBg" x1="0" y1="0" x2="1200" y2="396" gradientUnits="userSpaceOnUse">
      <stop stop-color="#110C09"/>
      <stop offset="0.52" stop-color="#1B140E"/>
      <stop offset="1" stop-color="#291C13"/>
    </linearGradient>
    <radialGradient id="hdrGlowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(990 205) rotate(90) scale(210 240)">
      <stop stop-color="#D48248" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#A65529" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#1B140E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hdrGlowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(130 370) rotate(90) scale(165 230)">
      <stop stop-color="#E8B07B" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#110C09" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cookieBase" x1="910" y1="138" x2="1055" y2="294" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7D5AE"/>
      <stop offset="0.48" stop-color="#DB9457"/>
      <stop offset="1" stop-color="#9A5026"/>
    </linearGradient>
    <radialGradient id="cookieHighlight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(952 178) rotate(35) scale(86)">
      <stop stop-color="#FFF5E6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFF5E6" stop-opacity="0"/>
    </radialGradient>
    <filter id="cookieShadow" x="874" y="122" width="224" height="224" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#070403" flood-opacity="0.62"/>
    </filter>
    <pattern id="hdrGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#F4DAC0" stroke-opacity="0.042"/>
    </pattern>
    <clipPath id="hdrFrame">
      <rect width="1200" height="396" rx="24"/>
    </clipPath>
    <clipPath id="cookieClip">
      <circle cx="984" cy="218" r="76"/>
    </clipPath>
    <mask id="cookieBiteMask" maskUnits="userSpaceOnUse" x="880" y="114" width="210" height="210">
      <rect x="880" y="114" width="210" height="210" fill="#ffffff"/>
      <circle cx="1044" cy="166" r="27" fill="#000000"/>
      <circle cx="1025" cy="147" r="18" fill="#000000"/>
    </mask>
  </defs>

  <g clip-path="url(#hdrFrame)">
    <rect width="1200" height="396" fill="url(#hdrBg)"/>
    <rect width="1200" height="396" fill="url(#hdrGrid)"/>
    <rect width="1200" height="396" fill="url(#hdrGlowRight)"/>
    <rect width="1200" height="396" fill="url(#hdrGlowLeft)"/>

    <!-- Architectural corner registration ticks -->
    <path d="M28 46V28H46M1172 46V28H1154M28 350V368H46M1172 350V368H1154" stroke="#D9935B" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>

    <!-- Top editorial status bar -->
    <text x="56" y="54" fill="#9E826B" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="600" letter-spacing="2.4">00 // PROFILE</text>
    <circle cx="186" cy="50" r="1.5" fill="#6F5744"/>
    <circle class="live-dot" cx="204" cy="50" r="4" fill="#E6A469"/>
    <text x="218" y="54" fill="#DFAA7B" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="500" letter-spacing="1.8">CRAFTING QUIET SOFTWARE</text>
    <text x="1144" y="54" text-anchor="end" fill="#9E826B" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="500" letter-spacing="2">PHILIPPINES · UTC+8</text>
    <line x1="56" y1="74" x2="1144" y2="74" stroke="#E8B88A" stroke-opacity="0.12" stroke-width="1"/>

    <!-- Hero Left Typography -->
    <text x="56" y="122" fill="#D48A52" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="600" letter-spacing="3.2">HELLO, I’M</text>
    <text x="54" y="186" fill="#FAF0E4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.6">Andrei John Geronimo</text>
    <text x="56" y="232" fill="#CEB7A2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400">I build <tspan fill="#F2C89C" font-weight="600">quiet tools</tspan> for busy minds.</text>
    <text x="56" y="268" fill="#9E836D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">Local-first software  ·  Grounded AI workflows  ·  Interactive 3D worlds</text>

    <!-- Bottom Handle & Role Pills -->
    <g transform="translate(56 306)">
      <rect width="204" height="40" rx="20" fill="#231912" stroke="#E8B88A" stroke-opacity="0.34" stroke-width="1.2"/>
      <circle cx="24" cy="20" r="4.5" fill="#E6A469"/>
      <text x="39" y="25" fill="#FAF0E4" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" font-weight="500">@butterkookies</text>
    </g>
    <g transform="translate(274 306)">
      <rect width="234" height="40" rx="20" fill="#17110D" stroke="#E8B88A" stroke-opacity="0.18" stroke-width="1"/>
      <text x="117" y="25" text-anchor="middle" fill="#C8B09A" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="500" letter-spacing="1.2">BS IT · FULL-STACK &amp; 3D</text>
    </g>

    <!-- Right Editorial Butter-Cookie & Reticle Emblem -->
    <g>
      <!-- Concentric studio orbits -->
      <circle cx="984" cy="218" r="126" stroke="#E8B88A" stroke-opacity="0.13" stroke-width="1" stroke-dasharray="3 7"/>
      <circle cx="984" cy="218" r="100" stroke="#E8B88A" stroke-opacity="0.2" stroke-width="1"/>
      <path d="M984 82V94M984 342V354M848 218H860M1108 218H1120" stroke="#D48A52" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Sculpted Butter Cookie with true transparent masked bite + cocoa chunks -->
      <g filter="url(#cookieShadow)">
        <g mask="url(#cookieBiteMask)">
          <g clip-path="url(#cookieClip)">
            <circle cx="984" cy="218" r="76" fill="url(#cookieBase)"/>
            <circle cx="984" cy="218" r="76" fill="url(#cookieHighlight)"/>
            <!-- Soft baked edge bevel -->
            <circle cx="984" cy="218" r="74.5" stroke="#FFF2DF" stroke-opacity="0.34" stroke-width="2"/>
            <!-- Dark-roast chocolate chunks -->
            <rect x="945" y="176" width="16" height="14" rx="5" transform="rotate(-14 953 183)" fill="#492414"/>
            <circle cx="950" cy="180" r="2" fill="#8C5132" opacity="0.65"/>

            <rect x="989" y="206" width="18" height="15" rx="6" transform="rotate(18 998 213)" fill="#421F10"/>
            <circle cx="995" cy="210" r="2.2" fill="#8C5132" opacity="0.6"/>

            <rect x="934" y="226" width="15" height="14" rx="5" transform="rotate(10 941 233)" fill="#4F2817"/>
            <circle cx="939" cy="230" r="1.8" fill="#8C5132" opacity="0.6"/>

            <rect x="974" y="253" width="17" height="14" rx="5.5" transform="rotate(-18 982 260)" fill="#452112"/>
            <circle cx="979" cy="257" r="2" fill="#8C5132" opacity="0.6"/>

            <rect x="1020" y="236" width="14" height="13" rx="4.5" transform="rotate(24 1027 242)" fill="#4D2615"/>
            <circle cx="968" cy="214" r="5" fill="#542B18"/>
            <circle cx="1008" cy="176" r="4.5" fill="#542B18"/>
          </g>
        </g>
      </g>

      <!-- Floating cookie crumbs -->
      <circle cx="1062" cy="148" r="3.2" fill="#E3A168" opacity="0.9"/>
      <circle cx="1074" cy="162" r="2.2" fill="#C97E49" opacity="0.8"/>
      <rect x="1051" y="135" width="4.5" height="4.5" rx="1.5" transform="rotate(22 1053 137)" fill="#F3CCA0" opacity="0.85"/>

      <!-- Minimal editorial code coordinates around reticle -->
      <text x="844" y="138" fill="#DCA677" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" font-weight="500" opacity="0.72">{</text>
      <text x="1114" y="308" fill="#DCA677" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" font-weight="500" opacity="0.72">}</text>
      <text x="836" y="314" fill="#DCA677" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="500" opacity="0.64">&lt;/&gt;</text>
      <text x="1098" y="134" fill="#DCA677" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" font-weight="500" opacity="0.64">01</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="394" rx="23" stroke="#E8B88A" stroke-opacity="0.22" stroke-width="1.5"/>
</svg>
