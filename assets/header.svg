<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Andrei John Geronimo, known as butterkookies</title>
  <desc id="desc">A warm espresso banner with playful cookie and code motifs and the phrase I build quiet tools for busy minds.</desc>
  <defs>
    <linearGradient id="bg" x1="74" y1="24" x2="1112" y2="344" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17120E"/>
      <stop offset="0.52" stop-color="#241A13"/>
      <stop offset="1" stop-color="#312015"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F0C39A"/>
      <stop offset="1" stop-color="#B96538"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#080604" flood-opacity="0.5"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#F3D9C0" stroke-opacity="0.055"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="1068" cy="72" r="190" fill="#A9532F" fill-opacity="0.15" filter="url(#blur)"/>
    <circle cx="118" cy="338" r="180" fill="#E0A06C" fill-opacity="0.09" filter="url(#blur)"/>

    <path d="M68 80V52H96M1132 280V308H1104" stroke="#D69A68" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    <text x="72" y="99" fill="#DCA677" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="3">HELLO, I’M</text>
    <text x="68" y="179" fill="#FFF4E8" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">Andrei John Geronimo</text>
    <text x="72" y="224" fill="#D8B99E" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400">I build quiet tools for busy minds.</text>

    <g transform="translate(72 266)">
      <rect width="216" height="42" rx="21" fill="#FFF4E8" fill-opacity="0.08" stroke="#E2B083" stroke-opacity="0.36"/>
      <circle cx="24" cy="21" r="5" fill="#D88952"/>
      <text x="40" y="27" fill="#F1D6BD" font-family="Consolas, monospace" font-size="17">@butterkookies</text>
    </g>

    <g transform="translate(914 53)" filter="url(#shadow)">
      <circle cx="112" cy="112" r="100" fill="url(#glow)"/>
      <path d="M164 24C164 48 183 67 207 67C203 47 187 31 164 24Z" fill="#241A13"/>
      <circle cx="82" cy="75" r="11" fill="#5B321F"/>
      <circle cx="134" cy="103" r="9" fill="#5B321F"/>
      <circle cx="72" cy="142" r="8" fill="#5B321F"/>
      <circle cx="143" cy="157" r="12" fill="#5B321F"/>
      <circle cx="109" cy="190" r="7" fill="#5B321F"/>
      <path d="M38 117C23 117 11 105 11 90M187 130C205 130 219 144 219 162" stroke="#F7D6B7" stroke-opacity="0.58" stroke-width="3" stroke-linecap="round"/>
      <path d="M-15 112L-34 112M-24 103V121M240 125L259 125M249 115V135" stroke="#D88952" stroke-width="3" stroke-linecap="round"/>
    </g>

    <g fill="#DCA677" font-family="Consolas, monospace" font-size="17" opacity="0.6">
      <text x="844" y="70">{</text>
      <text x="1109" y="272">}</text>
      <text x="863" y="306">&lt;/&gt;</text>
      <text x="1077" y="332">01</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="27" stroke="#E8B78A" stroke-opacity="0.16" stroke-width="2"/>
</svg>
