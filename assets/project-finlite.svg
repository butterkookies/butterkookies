    <g transform="translate(314 170)">
      <rect width="106" height="28" rx="14" fill="#231912" stroke="#E6AD61" stroke-opacity="0.26" stroke-width="1"/>
      <text x="53.0" y="18.2" text-anchor="middle" fill="#EBD7C4" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="500">Next.js 15</text>
    </g>
    <g transform="translate(428 170)">
      <rect width="91" height="28" rx="14" fill="#231912" stroke="#E6AD61" stroke-opacity="0.26" stroke-width="1"/>
      <text x="45.5" y="18.2" text-anchor="middle" fill="#EBD7C4" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="500">React 19</text>
    </g>
    <g transform="translate(527 170)">
      <rect width="114" height="28" rx="14" fill="#231912" stroke="#E6AD61" stroke-opacity="0.26" stroke-width="1"/>
      <text x="57.0" y="18.2" text-anchor="middle" fill="#EBD7C4" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="500">Tailwind v4</text>
    </g>
    <g transform="translate(649 170)">
      <rect width="91" height="28" rx="14" fill="#231912" stroke="#E6AD61" stroke-opacity="0.26" stroke-width="1"/>
      <text x="45.5" y="18.2" text-anchor="middle" fill="#EBD7C4" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="500">Supabase</text>
    </g>
    <g transform="translate(748 170)">
      <rect width="98" height="28" rx="14" fill="#231912" stroke="#E6AD61" stroke-opacity="0.26" stroke-width="1"/>
      <text x="49.0" y="18.2" text-anchor="middle" fill="#EBD7C4" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="500">Gemini AI</text>
    </g>
    <g transform="translate(854 170)">
      <rect width="83" height="28" rx="14" fill="#231912" stroke="#E6AD61" stroke-opacity="0.26" stroke-width="1"/>
      <text x="41.5" y="18.2" text-anchor="middle" fill="#EBD7C4" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="500">OpenXML</text>
