      <path d="M24 62H282M24 102H282M24 142H282M90 22V202M156 22V202M222 22V202" stroke="#E6AD61" stroke-opacity="0.06" stroke-width="1"/>
      <!-- Back tilted document -->
      <g transform="translate(88 46) rotate(-7)">
        <rect width="106" height="128" rx="10" fill="#231912" stroke="#E6AD61" stroke-opacity="0.22" stroke-width="1.2"/>
        <rect x="14" y="18" width="48" height="5" rx="2.5" fill="#E6AD61" opacity="0.22"/>
        <rect x="14" y="34" width="76" height="4" rx="2" fill="#C8B09A" opacity="0.16"/>
        <rect x="14" y="46" width="62" height="4" rx="2" fill="#C8B09A" opacity="0.14"/>
      </g>
      <!-- Front 1:1 Digital Paper DOCX Sheet -->
      <g transform="translate(106 42)">
        <rect width="112" height="136" rx="11" fill="#1C140F" stroke="#E6AD61" stroke-opacity="0.52" stroke-width="1.4"/>
        <!-- Header block -->
        <rect x="14" y="16" width="38" height="6" rx="3" fill="#E6AD61"/>
        <rect x="74" y="16" width="24" height="6" rx="3" fill="#E6AD61" opacity="0.32"/>
        <line x1="14" y1="32" x2="98" y2="32" stroke="#E6AD61" stroke-opacity="0.2" stroke-width="1"/>
        <!-- Ledger mini-table rows -->
        <rect x="14" y="42" width="54" height="5" rx="2.5" fill="#FAF0E4" opacity="0.72"/>
        <rect x="78" y="42" width="20" height="5" rx="2.5" fill="#E6AD61" opacity="0.8"/>
        <rect x="14" y="56" width="44" height="4.5" rx="2.2" fill="#C8B09A" opacity="0.45"/>
        <rect x="74" y="56" width="24" height="4.5" rx="2.2" fill="#C8B09A" opacity="0.4"/>
        <rect x="14" y="69" width="58" height="4.5" rx="2.2" fill="#C8B09A" opacity="0.45"/>
        <rect x="80" y="69" width="18" height="4.5" rx="2.2" fill="#E6AD61" opacity="0.65"/>
        <!-- Mini bar readout -->
        <rect x="14" y="88" width="84" height="32" rx="6" fill="#130E0A" stroke="#E6AD61" stroke-opacity="0.18"/>
        <rect x="24" y="106" width="10" height="8" rx="2" fill="#9E6932"/>
        <rect x="40" y="100" width="10" height="14" rx="2" fill="#C78A42"/>
        <rect x="56" y="95" width="10" height="19" rx="2" fill="#E6AD61"/>
        <rect x="72" y="102" width="10" height="12" rx="2" fill="#B67C3B"/>
      </g>
      <!-- Verified clearance seal -->
      <g transform="translate(198 144)">
        <circle cx="18" cy="18" r="18" fill="#18110C" stroke="#E6AD61" stroke-width="1.6"/>
