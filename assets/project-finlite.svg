    <text x="314" y="96" fill="#FAF0E4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.7">FinLITE</text>
    <text x="314" y="128" fill="#D1BAA5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">Financial management &amp; automated institutional DOCX generator engineered for LITE.</text>
    <text x="314" y="151" fill="#A98F78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">Unifies strict segregation of duties, 1:1 HTML paper preview, and a grounded Gemini co-pilot.</text>

