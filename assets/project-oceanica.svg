<svg width="1200" height="224" viewBox="0 0 1200 224" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p-title p-desc">
  <title id="p-title">Oceanica — Featured Project</title>
  <desc id="p-desc">A sunlit virtual aquarium &amp; botanical conservatory built on a dual-mode Koota ECS. Features 12-joint sinusoidal swim kinematics and Studio Ghibli cel-gouache sprite atlases.</desc>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1200" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15100C"/>
      <stop offset="0.58" stop-color="#1C150F"/>
      <stop offset="1" stop-color="#241A13"/>
    </linearGradient>
    <radialGradient id="artGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(153 112) rotate(90) scale(96 132)">
      <stop stop-color="#78B3A0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#100B08" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cardGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#F4DAC0" stroke-opacity="0.032"/>
    </pattern>
    <clipPath id="cardFrame">
      <rect width="1200" height="224" rx="22"/>
    </clipPath>
    <clipPath id="artClip">
      <rect x="24" y="22" width="258" height="180" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardFrame)">
    <rect width="1200" height="224" fill="url(#cardBg)"/>
    <rect width="1200" height="224" fill="url(#cardGrid)"/>

    <!-- Left Custom Illustration Showcase Window -->
    <g clip-path="url(#artClip)">
      <rect x="24" y="22" width="258" height="180" rx="16" fill="#100B08"/>
      <rect x="24" y="22" width="258" height="180" fill="url(#artGlow)"/>
      <!-- Diagonal sunlit conservatory water rays -->
      <polygon points="56,22 114,22 162,202 100,202" fill="#78B3A0" opacity="0.09"/>
      <polygon points="134,22 178,22 222,202 176,202" fill="#F0C69A" opacity="0.06"/>
      <!-- Water meniscus waves near top -->
      <path d="M24 58C64 50 104 66 150 58C196 50 236 66 282 57" stroke="#78B3A0" stroke-opacity="0.45" stroke-width="1.6" fill="none"/>
      <path d="M24 66C72 59 116 73 164 65C208 58 242 70 282 64" stroke="#78B3A0" stroke-opacity="0.2" stroke-width="1.2" fill="none"/>
      <!-- Warm sunlit sandbed curve -->
      <path d="M24 174C88 162 152 184 216 170C244 164 264 167 282 172V202H24V174Z" fill="#B88E62" opacity="0.22"/>
      <!-- Swaying aquatic botanical leaves -->
      <path d="M56 184C48 156 52 132 66 112C64 136 64 160 66 184Z" fill="#5D9684" opacity="0.72"/>
      <path d="M72 184C74 158 84 140 96 126C88 148 83 166 80 184Z" fill="#78B3A0" opacity="0.58"/>
      <path d="M240 182C232 154 224 136 210 120C222 142 228 162 230 182Z" fill="#5D9684" opacity="0.65"/>
      <path d="M250 182C256 156 262 138 254 114C246 138 244 160 242 182Z" fill="#78B3A0" opacity="0.48"/>
      <!-- Stylized Kohaku Koi swimming along sinusoidal S-curve -->
      <g transform="translate(88 86)">
        <!-- Flowing translucent veil tail -->
        <path d="M18 36C4 26 -4 18 2 14C10 10 20 22 26 28C20 34 10 46 2 48C-4 49 4 42 18 36Z" fill="#EBD7C4" opacity="0.55"/>
        <!-- Pectoral veil fins -->
        <path d="M68 24C60 12 48 10 46 17C45 23 58 28 66 29Z" fill="#FAF0E4" opacity="0.45"/>
        <path d="M68 42C60 54 48 56 46 49C45 43 58 38 66 37Z" fill="#FAF0E4" opacity="0.45"/>
        <!-- Main tapered koi body -->
        <path d="M20 34C38 22 66 18 94 25C108 29 116 34 116 36C116 39 107 45 92 47C64 51 38 45 20 34Z" fill="#FAF0E4"/>
        <!-- Kohaku terracotta-orange dorsal markings -->
        <path d="M74 22C88 22 100 26 104 32C94 36 80 35 72 30C68 27 70 23 74 22Z" fill="#DC7B4D"/>
        <path d="M40 27C52 24 62 27 64 34C56 39 44 38 38 33C36 31 37 28 40 27Z" fill="#DC7B4D"/>
        <!-- Subtle eye & whiskers -->
        <circle cx="104" cy="34" r="2.2" fill="#1C140F"/>
        <path d="M114 35C119 32 122 30 124 27M114 37C119 40 122 42 124 44" stroke="#E8B88A" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <!-- Rising oxygen bubbles -->
      <circle cx="212" cy="96" r="4.5" stroke="#9BD0BF" stroke-width="1.3" opacity="0.78"/>
      <circle cx="222" cy="81" r="2.8" stroke="#9BD0BF" stroke-width="1.2" opacity="0.62"/>
      <circle cx="198" cy="74" r="2" fill="#9BD0BF" opacity="0.5"/>
      <!-- Soft surface ripple ring -->
      <ellipse cx="148" cy="58" rx="28" ry="4" stroke="#F0C69A" stroke-opacity="0.32" stroke-width="1"/>
    </g>
    <rect x="24.5" y="22.5" width="257" height="179" rx="15.5" stroke="#78B3A0" stroke-opacity="0.28" stroke-width="1"/>

    <!-- Top Metadata & CTA Pill -->
    <circle cx="320" cy="48" r="4" fill="#78B3A0"/>
    <text x="334" y="52" fill="#78B3A0" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="600" letter-spacing="2.2">INTERACTIVE 2.5D / 3D SIMULATION</text>

    <g transform="translate(1018 32)">
      <rect width="132" height="30" rx="15" fill="#251A13" stroke="#E8B88A" stroke-opacity="0.28" stroke-width="1"/>
      <text x="66" y="19.5" text-anchor="middle" fill="#F2D7BC" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">VIEW REPO ↗</text>
    </g>

    <!-- Title & Editorial Copy -->
    <text x="314" y="96" fill="#FAF0E4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.7">Oceanica</text>
    <text x="314" y="128" fill="#D1BAA5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">A sunlit virtual aquarium &amp; botanical conservatory built on a dual-mode Koota ECS.</text>
    <text x="314" y="151" fill="#A98F78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">Features 12-joint sinusoidal swim kinematics and Studio Ghibli cel-gouache sprite atlases.</text>

    <!-- Tech Stack Pills -->
    <g transform="translate(314 170)">
      <rect width="91" height="28" rx="14" fill="#231912" stroke="#78B3A0" stroke-opacity="0.26" stroke-width="1"/>
      <text x="45.5" y="18.2" text-anchor="middle" fill="#EBD7C4" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="500">React 19</text>
    </g>
    <g transform="translate(413 170)">
      <rect width="91" height="28" rx="14" fill="#231912" stroke="#78B3A0" stroke-opacity="0.26" stroke-width="1"/>
      <text x="45.5" y="18.2" text-anchor="middle" fill="#EBD7C4" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="500">Three.js</text>
    </g>
    <g transform="translate(512 170)">
      <rect width="159" height="28" rx="14" fill="#231912" stroke="#78B3A0" stroke-opacity="0.26" stroke-width="1"/>
      <text x="79.5" y="18.2" text-anchor="middle" fill="#EBD7C4" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="500">React Three Fiber</text>
    </g>
    <g transform="translate(679 170)">
      <rect width="106" height="28" rx="14" fill="#231912" stroke="#78B3A0" stroke-opacity="0.26" stroke-width="1"/>
      <text x="53.0" y="18.2" text-anchor="middle" fill="#EBD7C4" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="500">TypeScript</text>
    </g>
    <g transform="translate(793 170)">
      <rect width="98" height="28" rx="14" fill="#231912" stroke="#78B3A0" stroke-opacity="0.26" stroke-width="1"/>
      <text x="49.0" y="18.2" text-anchor="middle" fill="#EBD7C4" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="500">Koota ECS</text>
    </g>
    <g transform="translate(899 170)">
      <rect width="60" height="28" rx="14" fill="#231912" stroke="#78B3A0" stroke-opacity="0.26" stroke-width="1"/>
      <text x="30.0" y="18.2" text-anchor="middle" fill="#EBD7C4" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="500">Vite</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="222" rx="21" stroke="#E8B88A" stroke-opacity="0.2" stroke-width="1.5"/>
</svg>
