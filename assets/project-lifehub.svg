<svg width="1200" height="224" viewBox="0 0 1200 224" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p-title p-desc">
  <title id="p-title">Life Hub Assistant — Featured Project</title>
  <desc id="p-desc">Installable Notion &amp; Calendar AI assistant built for zero-cost private self-hosting. Includes native voice notes, treadmill photo workout scanning, and automated briefings.</desc>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1200" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15100C"/>
      <stop offset="0.58" stop-color="#1C150F"/>
      <stop offset="1" stop-color="#241A13"/>
    </linearGradient>
    <radialGradient id="artGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(153 112) rotate(90) scale(96 132)">
      <stop stop-color="#DC8262" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#100B08" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cardGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#F4DAC0" stroke-opacity="0.032"/>
    </pattern>
    <clipPath id="cardFrame">
      <rect width="1200" height="224" rx="22"/>
    </clipPath>
    <clipPath id="artClip">
      <rect x="24" y="22" width="258" height="180" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardFrame)">
    <rect width="1200" height="224" fill="url(#cardBg)"/>
    <rect width="1200" height="224" fill="url(#cardGrid)"/>

    <!-- Left Custom Illustration Showcase Window -->
    <g clip-path="url(#artClip)">
      <rect x="24" y="22" width="258" height="180" rx="16" fill="#100B08"/>
      <rect x="24" y="22" width="258" height="180" fill="url(#artGlow)"/>
      <!-- Subtle orbital sync rings -->
      <circle cx="152" cy="112" r="76" stroke="#DC8262" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="3 6"/>
      <!-- Mobile PWA Frame -->
      <g transform="translate(88 38)">
        <rect width="92" height="148" rx="18" fill="#1B130E" stroke="#DC8262" stroke-opacity="0.56" stroke-width="1.5"/>
        <!-- Dynamic notch -->
        <rect x="30" y="10" width="32" height="5" rx="2.5" fill="#32241A"/>
        <!-- Morning briefing mini card -->
        <rect x="11" y="25" width="70" height="32" rx="8" fill="#261B14" stroke="#E8B88A" stroke-opacity="0.18"/>
        <circle cx="21" cy="36" r="3.5" fill="#F0C69A"/>
        <rect x="29" y="33.5" width="36" height="4.5" rx="2.2" fill="#FAF0E4" opacity="0.78"/>
        <rect x="18" y="45" width="50" height="3.5" rx="1.75" fill="#C8B09A" opacity="0.45"/>
        <!-- Native In-App Voice Waveform -->
        <rect x="11" y="66" width="70" height="44" rx="9" fill="#130D0A" stroke="#DC8262" stroke-opacity="0.28"/>
        <rect x="20" y="83" width="4.5" height="10" rx="2.25" fill="#9C563C"/>
        <rect x="29" y="77" width="4.5" height="22" rx="2.25" fill="#DC8262"/>
        <rect x="38" y="73" width="4.5" height="30" rx="2.25" fill="#F0C69A"/>
        <rect x="47" y="79" width="4.5" height="18" rx="2.25" fill="#DC8262"/>
        <rect x="56" y="75" width="4.5" height="26" rx="2.25" fill="#E8A276"/>
        <rect x="65" y="83" width="4.5" height="10" rx="2.25" fill="#9C563C"/>
        <!-- Bottom mic pill button -->
        <circle cx="46" cy="128" r="10" fill="#DC8262" opacity="0.24" stroke="#DC8262" stroke-width="1.2"/>
        <circle cx="46" cy="128" r="4" fill="#F4C7A1"/>
      </g>
      <!-- Dotted sync arc to floating Notion Workspace tile -->
      <path d="M184 90C202 82 212 72 216 62" stroke="#F0C69A" stroke-opacity="0.55" stroke-width="1.3" stroke-dasharray="3 4" stroke-linecap="round"/>
      <!-- Floating Notion-style workspace card -->
      <g transform="translate(190 42)">
        <rect width="62" height="62" rx="12" fill="#231912" stroke="#E8B88A" stroke-opacity="0.34" stroke-width="1.2"/>
        <text x="15" y="34" fill="#FAF0E4" font-family="{MONO}" font-size="20" font-weight="700">N</text>
        <rect x="36" y="18" width="14" height="4" rx="2" fill="#DC8262"/>
        <rect x="36" y="26" width="12" height="3.5" rx="1.75" fill="#C8B09A" opacity="0.5"/>
        <rect x="14" y="44" width="34" height="4" rx="2" fill="#E8B88A" opacity="0.35"/>
      </g>
      <!-- Private Tailscale badge node bottom-right -->
      <g transform="translate(198 130)">
        <rect width="50" height="34" rx="10" fill="#1C140F" stroke="#DC8262" stroke-opacity="0.32" stroke-width="1"/>
        <circle cx="15" cy="17" r="2.6" fill="#78B3A0"/>
        <circle cx="25" cy="17" r="2.6" fill="#F0C69A"/>
        <circle cx="35" cy="17" r="2.6" fill="#DC8262"/>
      </g>
    </g>
    <rect x="24.5" y="22.5" width="257" height="179" rx="15.5" stroke="#DC8262" stroke-opacity="0.28" stroke-width="1"/>

    <!-- Top Metadata & CTA Pill -->
    <circle cx="320" cy="48" r="4" fill="#DC8262"/>
    <text x="334" y="52" fill="#DC8262" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="600" letter-spacing="2.2">PERSONAL AI · MOBILE-FIRST PWA</text>

    <g transform="translate(1018 32)">
      <rect width="132" height="30" rx="15" fill="#251A13" stroke="#E8B88A" stroke-opacity="0.28" stroke-width="1"/>
      <text x="66" y="19.5" text-anchor="middle" fill="#F2D7BC" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">VIEW REPO ↗</text>
    </g>

    <!-- Title & Editorial Copy -->
    <text x="314" y="96" fill="#FAF0E4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.7">Life Hub Assistant</text>
    <text x="314" y="128" fill="#D1BAA5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">Installable Notion &amp; Calendar AI assistant built for zero-cost private self-hosting.</text>
    <text x="314" y="151" fill="#A98F78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">Includes native voice notes, treadmill photo workout scanning, and automated briefings.</text>

    <!-- Tech Stack Pills -->
    <g transform="translate(314 170)">
      <rect width="83" height="28" rx="14" fill="#231912" stroke="#DC8262" stroke-opacity="0.26" stroke-width="1"/>
      <text x="41.5" y="18.2" text-anchor="middle" fill="#EBD7C4" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="500">FastAPI</text>
    </g>
    <g transform="translate(405 170)">
      <rect width="76" height="28" rx="14" fill="#231912" stroke="#DC8262" stroke-opacity="0.26" stroke-width="1"/>
      <text x="38.0" y="18.2" text-anchor="middle" fill="#EBD7C4" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="500">Python</text>
    </g>
    <g transform="translate(489 170)">
      <rect width="68" height="28" rx="14" fill="#231912" stroke="#DC8262" stroke-opacity="0.26" stroke-width="1"/>
      <text x="34.0" y="18.2" text-anchor="middle" fill="#EBD7C4" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="500">React</text>
    </g>
    <g transform="translate(565 170)">
      <rect width="98" height="28" rx="14" fill="#231912" stroke="#DC8262" stroke-opacity="0.26" stroke-width="1"/>
      <text x="49.0" y="18.2" text-anchor="middle" fill="#EBD7C4" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="500">Gemini AI</text>
    </g>
    <g transform="translate(671 170)">
      <rect width="106" height="28" rx="14" fill="#231912" stroke="#DC8262" stroke-opacity="0.26" stroke-width="1"/>
      <text x="53.0" y="18.2" text-anchor="middle" fill="#EBD7C4" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="500">Notion API</text>
    </g>
    <g transform="translate(785 170)">
      <rect width="98" height="28" rx="14" fill="#231912" stroke="#DC8262" stroke-opacity="0.26" stroke-width="1"/>
      <text x="49.0" y="18.2" text-anchor="middle" fill="#EBD7C4" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="500">Tailscale</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="222" rx="21" stroke="#E8B88A" stroke-opacity="0.2" stroke-width="1.5"/>
</svg>
