<svg width="1200" height="254" viewBox="0 0 1200 254" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ab-title ab-desc">
  <title id="ab-title">About Andrei John Geronimo</title>
  <desc id="ab-desc">Overview of Andrei's software craft and personal engineering field notes.</desc>
  <defs>
    <linearGradient id="abBg" x1="0" y1="0" x2="1200" y2="254" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15100C"/>
      <stop offset="0.55" stop-color="#1B140F"/>
      <stop offset="1" stop-color="#221811"/>
    </linearGradient>
    <pattern id="abGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#F4DAC0" stroke-opacity="0.036"/>
    </pattern>
    <clipPath id="abFrame">
      <rect width="1200" height="254" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#abFrame)">
    <rect width="1200" height="254" fill="url(#abBg)"/>
    <rect width="1200" height="254" fill="url(#abGrid)"/>

    <!-- Left Bio Column -->
    <text x="52" y="52" fill="#D48A52" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="600" letter-spacing="2.6">01 // ABOUT</text>
    <text x="52" y="96" fill="#CEB7A2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="400">I’m <tspan fill="#FAF0E4" font-weight="700">Andrei</tspan>, a developer who turns ambitious ideas into</text>
    <text x="52" y="127" fill="#CEB7A2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="400">focused, tactile software. I care about <tspan fill="#F0C69A" font-weight="600">local-first craft</tspan>,</text>
    <text x="52" y="158" fill="#CEB7A2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="400">grounded AI tools, and calm interfaces that stay out of the way.</text>

    <line x1="52" y1="186" x2="296" y2="186" stroke="#D48A52" stroke-opacity="0.35" stroke-width="1.2"/>
    <text x="52" y="216" fill="#9A806A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400">Building across full-stack web apps, native utilities, and interactive 3D worlds.</text>

    <!-- Right Recessed Field Notes Terminal Well -->
    <g transform="translate(684 28)">
      <rect width="464" height="198" rx="16" fill="#110C09" stroke="#E8B88A" stroke-opacity="0.16" stroke-width="1"/>
      <circle cx="22" cy="24" r="4" fill="#D48A52"/>
      <circle cx="36" cy="24" r="4" fill="#8A5734"/>
      <circle cx="50" cy="24" r="4" fill="#4D3422"/>
      <text x="442" y="28" text-anchor="end" fill="#8E7560" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" letter-spacing="1.6">FIELD_NOTES.TXT</text>
      <line x1="0" y1="42" x2="464" y2="42" stroke="#E8B88A" stroke-opacity="0.1" stroke-width="1"/>

      <text y="76" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5">
        <tspan x="22" fill="#D48A52" font-weight="600">focus</tspan>
        <tspan x="84" fill="#6E5643">→</tspan>
        <tspan x="108" fill="#F2E2D0">local-first · AI systems · 3D UI</tspan>
      </text>
      <text y="108" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5">
        <tspan x="22" fill="#D48A52" font-weight="600">loop</tspan>
        <tspan x="84" fill="#6E5643">→</tspan>
        <tspan x="108" fill="#F2E2D0">build · break · simplify · ship</tspan>
      </text>
      <text y="140" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5">
        <tspan x="22" fill="#D48A52" font-weight="600">belief</tspan>
        <tspan x="84" fill="#6E5643">→</tspan>
        <tspan x="108" fill="#F2E2D0">good tools give attention back</tspan>
      </text>
      <text y="172" font-family="'SFMono-Regular', ui-monospace, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5">
        <tspan x="22" fill="#D48A52" font-weight="600">based</tspan>
        <tspan x="84" fill="#6E5643">→</tspan>
        <tspan x="108" fill="#F2E2D0">Philippines · UTC+8</tspan>
      </text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="252" rx="23" stroke="#E8B88A" stroke-opacity="0.2" stroke-width="1.5"/>
</svg>
